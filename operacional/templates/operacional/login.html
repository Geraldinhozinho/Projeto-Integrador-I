{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <link rel="stylesheet" href="{% static 'operacional/css/frequencia.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 { margin-bottom: 20px; color: #2c3e50; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid #ccc; border-radius: 4px; font-size: 16px;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%; background-color: #27ae60; color: white;
            padding: 12px; border: none; border-radius: 4px;
            font-size: 16px; cursor: pointer; font-weight: bold;
        }
        .btn-login:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="{% static 'img/suap_logo.svg' %}" alt="SUAP" style="width: 120px; margin-bottom: 20px;">
        <h2>Acesso ao Sistema</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div style="background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="matricula" class="login-input" placeholder="Digite sua matrícula" required autofocus>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</body>
</html>
