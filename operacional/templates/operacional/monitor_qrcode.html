{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de QR Code - COADES</title>
    <link rel="stylesheet" href="{% static 'css/monitor_qrcode.css' %}">
</head>
<body>
<div class="monitor-container">
    <h1 class="monitor-titulo">Monitor de QR Code - COADES</h1>
    <p class="monitor-descricao">O código se atualiza automaticamente a cada 50 segundos.</p>
    
    <div class="qr-display">
        <img id="qr-image" src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code">
    </div>
    
    <div class="timer">
        Próxima atualização em: <span id="countdown">50</span>s
    </div>
    
    <div class="info">
        <p><strong>Token atual:</strong> {{ token }}</p>
        <p class="info-dica">
            Os bolsistas devem escanear este código com a câmera do celular
        </p>
    </div>
</div>

<script src="js/monitor_qrcode.js"></script>
</body>
</html>
