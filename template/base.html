{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block css_personalizado %}

    {% endblock %}

</head>

<body>
    <div class="pagina">
        <div class="layout">
            <header>
                <div id="topo">
                    <img id="logo" src="{% static 'img/suap_logo.svg' %}" alt="">
                    <div id="botao_sino" >
                        <span id="notificacao">21</span>
                        <div id="icon">
                            <img id="sino" src="{% static 'img/bell.svg' %}" alt="">
                        </div>
                    </div>
                </div>
                <div id="group_user">
                    <div id="user">
                        <div id="icon_pessoa" >
                            <img  id="pessoa" src="{% static 'img/user_dark.svg' %}" alt="">
                        </div>
                        <p>Usuário do SUAP</p>
                    </div>
                    <div id="user2">
                        <img id="pessoa2" src="{% static 'img/user.svg' %}" alt="">
                    </div>
                </div>

                <div id="search">
                    <img src="{% static 'img/search_dark.svg' %}" alt="search" id="search-icon">
                    <input type="text" placeholder="Buscar menu">
                </div>





            </header>
            <div class="area-principal">
                <main>
                    {% block main %}
                    {% endblock %}
                </main>
                <footer>
                    <div class="footer-item"></div>
                    <div class="footer-item"></div>
                    <div class="footer-item"></div>
                    <div class="footer-item"></div>
                </footer>
            </div>
        </div>
    </div>
</body>

</html>
